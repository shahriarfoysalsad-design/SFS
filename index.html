<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#2563eb);
}

.contact-box{
    width:90%;
    max-width:400px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.contact-box h1{
    color:#2563eb;
    margin-bottom:10px;
}

.contact-box p{
    color:#666;
    margin-bottom:30px;
}

.btn{
    display:block;
    text-decoration:none;
    color:#fff;
    padding:15px;
    margin:15px 0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn i{
    margin-right:10px;
}

.call{
    background:#2563eb;
}

.call:hover{
    background:#1d4ed8;
}

.whatsapp{
    background:#25D366;
}

.whatsapp:hover{
    background:#1ca851;
}

</style>






<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body bgcolor="000080" text="white"></body>
<body>
<div class="contact-box">

    <h1>Contact Us</h1>
    <p>Feel free to contact us anytime.</p>

    Call now :01723277322
    <br>
    <br>

    <a href="https://wa.me/01328392959" target="_blank" class="btn whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        WhatsApp
    </a>

</div>

</body>
</html>
